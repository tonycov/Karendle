<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Karendle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game">
    <h1>Karendle</h1>
    <p class="instructions">Guess the secret five-letter word in 6 tries. Use the on-screen keyboard below (mobile friendly).</p>

    <div id="board" class="board" aria-label="Karendle guesses">
      <!-- 6 rows x 5 tiles -->
    </div>

    <div id="message" class="message" aria-live="polite"></div>

    <div id="keyboard" class="keyboard" aria-hidden="false"></div>

    <div class="controls">
      <button id="restart" class="btn">Restart</button>
    </div>

    <p class="note">Secret word is read from <code>secret.txt</code> in this repository.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
